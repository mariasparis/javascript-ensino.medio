<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Soma de 1 até N</title>
</head>

<body>

    <h1>Calculadora de Soma de 1 até N</h1>

    <label for="numeroN">Digite um número N:</label>

    <input type="number" id="numeroN" name="numeroN">

    <button onclick="calcularSoma()">Calcular Soma</button>

    <p id="resultado"></p>

    <script>
        function calcularSoma() {
            const numeroN = parseInt(
                document.getElementById('numeroN').value
            );

            if (isNaN(numeroN) || numeroN <= 0) {
                alert('Por favor, digite um número válido maior que zero.');
                return;
            }

            let soma = 0;
            let contador = 1;

            while (contador <= numeroN) {
                soma += contador;
                contador++;
            }

            const resultadoElement =
                document.getElementById('resultado');

            resultadoElement.textContent =
                `A soma de todos os números de 1 até ${numeroN} é ${soma}.`;
        }
    </script>

</body>

</html>
